[project]
name = "finsight-gemma"
version = "0.1.0"
description = "Neuro-symbolic financial filing auditor: Gemma 4 reads, deterministic code computes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "ollama>=0.4",
  "google-genai>=1.0",
  "typer>=0.12",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
finsight = "finsight.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
