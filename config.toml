# Model IDs are verified at setup (plan.md P0). Never hardcode them in code.
[backends.local]
provider = "ollama"
host = "http://localhost:11434"
triage_model = "gemma4:e4b"       # fast, cheap; ambiguous-page triage only
extract_model = "gemma4:e4b"      # RTX 4050 6GB VRAM: only e4b fits (5-5.5GB at Q4); 26b needs ~18GB
num_ctx = 4096                    # CRITICAL: keep low on 6GB VRAM; KV cache overflows above ~8K on this card
temperature = 0.0
# hardware_note: RTX 4050 Laptop 6141MB VRAM. gemma4:e4b (Q4_K_M) uses ~5-5.5GB.
# num_ctx=4096 leaves ~0.5-1GB for KV cache. Do NOT raise above 8192 or layers spill to RAM.
# For best extraction quality, use --backend cloud (Gemini API) which has no VRAM constraint.

[backends.cloud]
provider = "gemini"
extract_model = "gemma-4-31b-it"       # VERIFIED 2026-10-17: live on Gemini API, best quality
fast_model   = "gemma-4-26b-a4b-it"   # VERIFIED 2026-10-17: MoE, 4B active, faster + cheaper
api_key_env = "GEMINI_API_KEY"
temperature = 0.0

[routing]
default = "auto"                  # auto | local | cloud
confidential_forces_local = true

[verification]
rel_tol = 0.005
abs_tol = 1.0
max_retries = 3

[thresholds]
lie_factor_tolerance = 0.05
non_gaap_bloat_flag = 0.25
beneish_m_flag = -1.78
cash_conversion_floor = 0.8
accrual_ratio_flag = 0.05

[dcf]
years = 10
mc_runs = 10000
mc_seed = 7

[triage]
max_pages_for_model = 40          # keyword scoring ranks pages; only top ambiguous pages go to the small model
render_dpi = 160
